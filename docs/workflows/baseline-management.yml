name: VibeGuard Baseline Management
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  # Job 1: Update baseline on main branch merges
  update-baseline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install VibeGuard
        run: pip install vibeguard-gate

      - name: Create/update baseline
        run: vibeguard baseline create --output .vibeguard-baseline.json

      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .vibeguard-baseline.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore: update vibeguard baseline"
          # Race protection: another push may have landed since we cloned.
          # Rebase onto the latest main and retry up to 3 times before giving up.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent push). Retrying..."
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push baseline after 3 retries."
          exit 1

  # Job 2: Use baseline in PR gate
  pr-gate-with-baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install VibeGuard
        run: pip install vibeguard-gate

      - name: Run gate with baseline
        run: vibeguard gate --diff --fail-on high --baseline .vibeguard-baseline.json
