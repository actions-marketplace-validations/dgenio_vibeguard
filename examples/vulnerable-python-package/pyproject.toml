[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnerable-python-package"
version = "0.1.0"
description = "Example Python package with intentional security issues — VibeGuard demo"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "requests",
    "paramiko",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    ".env",
    "tests/",
    "**/*.map",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vulnerable_pkg"]
