name: Bug report
description: Report incorrect behavior, a crash, or unexpected output from VibeGuard.
title: "[bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections below so the maintainers can reproduce and triage quickly.

        For **suspected security vulnerabilities**, use the private advisory link on the "New issue" page instead — see [SECURITY.md](https://github.com/dgenio/vibeguard/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what went wrong.
      placeholder: "vibeguard scan crashes when run against a directory containing a symlink loop."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact commands and inputs. A minimal failing fixture is most helpful.
      value: |
        1. `git clone …`
        2. `cd …`
        3. `vibeguard scan --path .`
        4. See output below.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "Scan should complete with a list of findings, or exit with a clear error message."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and any stack trace.
      render: shell
    validations:
      required: true

  - type: input
    id: vibeguard-version
    attributes:
      label: VibeGuard version
      description: Output of `vibeguard version` (or `vibeguard --version`).
      placeholder: "0.6.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other (mention in repro)
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if any)
      description: Optional. Anything you've tried that side-steps the problem.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/dgenio/vibeguard/issues?q=is%3Aissue) and did not find a duplicate.
          required: true
        - label: I am reporting a bug, not requesting a feature or new rule.
          required: true
